<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>карманная камичка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-left-bar">
        <button class="ach-btn" id="achBtn">🏆 ачивки</button>
        <button class="ach-btn" id="memeBtn" style="display:none">🌟 меме</button>
        <button class="ach-btn" id="careBtn">🧸 забота</button>
        <button class="ach-btn" id="dailyBtn">📅 бонус</button>
        <button class="ach-btn" id="invBtn">🎒 сумка</button>
        <button class="ach-btn" id="chatBtn">💬 чат</button>
        <div class="friendship-counter" id="friendCounter">❤ 0</div>
    </div>

    <div class="theme-switcher">
        <button class="theme-btn" data-theme="dark"     style="background:#2a2a2a" title="тёмная"></button>
        <button class="theme-btn" data-theme="gray"     style="background:#4a4a4a" title="серая"></button>
        <button class="theme-btn" data-theme="night"    style="background:#1a1a2e" title="ночь"></button>
        <button class="theme-btn" data-theme="rose"     style="background:#3d2222" title="роза"></button>
        <button class="theme-btn" data-theme="forest"   style="background:#1e2f1e" title="лес"></button>
        <button class="theme-btn" data-theme="ocean"    style="background:#1a2a3a" title="океан"></button>
        <button class="theme-btn" data-theme="light"    style="background:#e8e8e8" title="светлая"></button>
        <button class="theme-btn" data-theme="violet"   style="background:#1a0f2e" title="фиолетовая тёмная"></button>
        <button class="theme-btn" data-theme="lavender" style="background:#2e1f42" title="лаванда"></button>
        <button class="theme-btn" data-theme="lilac"    style="background:#4a3560" title="лиловая"></button>
    </div>

    <div class="timer-panel" id="timerPanel">
        <div class="timer-current" id="timerCurrent">⏱ 00:00</div>
        <div class="timer-total" id="timerTotal">всего: 0ч</div>
    </div>

    <div class="stats-panel" id="statsPanel">
        <div class="stat-row">
            <div class="stat-icon">😊</div>
            <div class="stat-bar"><div class="stat-fill mood-fill" id="statMoodFill"></div></div>
            <div class="stat-value" id="statMoodVal">0</div>
        </div>
        <div class="stat-row">
            <div class="stat-icon">🍔</div>
            <div class="stat-bar"><div class="stat-fill hunger-fill" id="statHungerFill"></div></div>
            <div class="stat-value" id="statHungerVal">0</div>
        </div>
        <div class="stat-row">
            <div class="stat-icon">🧼</div>
            <div class="stat-bar"><div class="stat-fill clean-fill" id="statCleanFill"></div></div>
            <div class="stat-value" id="statCleanVal">0</div>
        </div>
    </div>

    <div class="music-player" id="musicPlayer">
        <div class="music-bar">
            <button class="music-btn" id="musicPrev" title="предыдущий">⏮</button>
            <button class="music-btn music-play" id="musicPlay" title="играть">▶</button>
            <button class="music-btn" id="musicNext" title="следующий">⏭</button>
            <div class="music-info">
                <div class="music-title" id="musicTitle">нет треков</div>
                <div class="music-progress-wrap" id="musicProgressWrap">
                    <div class="music-progress-fill" id="musicProgressFill"></div>
                </div>
            </div>
            <div class="music-time" id="musicTime">0:00 / 0:00</div>
            <div class="music-volume-wrap" title="громкость">
                <span class="music-vol-icon">🔊</span>
                <input type="range" class="music-volume" id="musicVolume" min="0" max="1" step="0.01" value="0.7">
            </div>
            <button class="music-btn music-repeat" id="musicRepeat" title="повтор">🔁</button>
            <button class="music-btn music-expand" id="musicExpand" title="плейлист">▼</button>
        </div>
        <div class="music-list" id="musicList"></div>
    </div>

    <div class="ach-panel" id="achPanel"></div>
    <div class="meme-panel" id="memePanel"></div>
    <div class="care-panel" id="carePanel"></div>
    <div class="shop-panel" id="shopPanel"></div>
    <div class="daily-panel" id="dailyPanel"></div>
    <div class="inv-panel" id="invPanel"></div>
    <div class="vitrina-panel" id="vitrinaPanel"></div>

    <div class="pet-widget sleeping" id="petWidget">
        <div class="youtube-overlay" id="youtubeOverlay">
            <div class="overlay-drag-handle" id="overlayDragHandle">⋮⋮</div>
            <iframe id="youtubeIframe" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            <video id="localVideo" playsinline muted preload="metadata" controls></video>
            <button class="fullscreen-btn" id="fullscreenBtn" title="на весь экран">⛶</button>
        </div>
        <div class="pet-layer" id="petLayer"></div>
        <div class="pet-icon pet-question" id="petQuestion">?</div>
        <div class="pet-icon pet-angry-mark" id="petAngryMark">💢</div>
        <div class="pet-speech" id="petSpeech"></div>
    </div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header" id="chatHeader"><span class="chat-drag-dots">⋮⋮</span></div>
        <div class="chat-status" id="chatStatus"></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-choices" id="chatChoices"></div>
        <div class="chat-input-row">
            <input type="text" class="chat-input" id="chatInput" maxlength="120" placeholder="напиши что-нибудь..." autocomplete="off">
            <button class="chat-send" id="chatSend" aria-label="отправить">➤</button>
        </div>
    </div>

    <div class="care-cursor" id="careCursor">🪮</div>
    <div class="care-progress" id="careProgress"></div>

    <div class="dev-version" id="devVersion">v 1.0.2</div>

    <div class="devlog-modal" id="devlogModal">
        <div class="devlog-box">
            <button class="devlog-close" id="devlogClose">×</button>
            <div class="devlog-header">📜 дев-лог</div>
            <div id="devlogBody"></div>
        </div>
    </div>

    <audio id="audioEl" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
