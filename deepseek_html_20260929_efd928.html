<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Тамагочи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pet-widget" id="petWidget">
        <!-- Слой для отображения картинок -->
        <div class="pet-layer" id="petLayer"></div>
        
        <!-- Иконка вопроса -->
        <div class="pet-icon pet-question" id="petQuestion">?</div>
        
        <!-- Значок злости -->
        <div class="pet-icon pet-angry-mark" id="petAngryMark">💢</div>
        
        <!-- Облачко с репликами -->
        <div class="pet-speech" id="petSpeech"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
